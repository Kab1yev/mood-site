<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<title>Көңіл-күй бойынша ұсыныс</title>

<style>
body {
    text-align: center;
    font-family: Arial, sans-serif;
    transition: 0.5s;
    margin: 0;
    padding: 0;
}

h1 {
    margin-top: 40px;
}

.buttons {
    margin-top: 20px;
}

button {
    margin: 10px;
    padding: 12px 20px;
    font-size: 16px;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
}

#result {
    margin-top: 30px;
    font-size: 18px;
    opacity: 0;
    transition: 0.5s;
}

/* фондар */
.happy { background: #ffe066; }
.sad { background: #74c0fc; }
.tired { background: #343a40; color: white; }

/* карточка */
.card {
    display: inline-block;
    background: white;
    padding: 20px;
    border-radius: 15px;
    margin-top: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.tired .card {
    background: #495057;
    color: white;
}
</style>
</head>

<body>

<h1>Көңіл-күйіңізді таңдаңыз 😊</h1>

<div class="buttons">
    <button onclick="suggest('happy')">😊 Қуанышты</button>
    <button onclick="suggest('sad')">😢 Мұңды</button>
    <button onclick="suggest('tired')">😴 Шаршаған</button>
</div>

<div id="result"></div>

function random(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function suggest(mood) {
    document.body.className = mood;

    let result = document.getElementById("result");

    result.style.opacity = 0;

    setTimeout(() => {
        result.innerHTML = `
            <div class="card">
                <h2>Ұсыныс:</h2>
                🎬 <b>Фильм:</b> ${random(data[mood].movies)} <br><br>
                🎵 <b>Музыка:</b> ${random(data[mood].music)} <br><br>
                📚 <b>Іс-әрекет:</b> ${random(data[mood].activity)}
            </div>
        `;
        result.style.opacity = 1;
    }, 200);
}
</script>
